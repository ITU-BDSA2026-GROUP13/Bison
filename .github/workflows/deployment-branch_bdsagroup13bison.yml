# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - bdsagroup13bison

on:
  push:
    branches:
      - 'deployment-branch'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Ensure browsers are installed
        run: pwsh test/Bison.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps

      - name: Start server for tests
        working-directory: src/Bison.Razor
        run: dotnet run --no-build --configuration Release --launch-profile E2E > api.log 2>&1 &

      - name: Wait for server to start
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5273/obs > /dev/null 2>&1; then
              echo "Server is running!"
              exit 0
            fi
            echo "Waiting for server to start...($i/30)"
            sleep 1
          done
          echo "Server failed to start within 30 seconds"
          cat src/Bison.Razor/api.log
          exit 1

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: dotnet publish
        run: dotnet publish src/Bison.Razor/ -c Release --no-build -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F48818F9E0D14362AA54107966EA1F23 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_49CE52C44F1C406FBE61A56C63F27DC1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1BA33C50FE2840DABBEA4DB3612A37A1 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bdsagroup13bison'
          slot-name: 'Production'
          package: .
      - name: Verify deployment
        run: curl --fail --location --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused https://bdsagroup13bison.azurewebsites.net/obs
          
